[package]
name = "vision-rs"
version = "0.1.0"
edition = "2024"
description = "A high-performance computer vision SDK for Rust."
license = "Apache-2.0"
repository = "https://github.com/spinorml/vision-rs"
homepage = "https://github.com/spinorml/vision-rs"
documentation = "https://docs.rs/vision-rs"
readme = "README.md"
keywords = ["computer-vision", "yolo", "detection", "segmentation", "tracking", "counting"]
categories = ["computer-vision", "object-detection", "object-segmentation"]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["cuda", "training"]
cuda = ["teeny-cuda", "teeny-compiler"]
training = ["teeny-kernels/training", "teeny-core/training"]

[dependencies]
teeny-core     = { version = "0.1", features = ["std"] }
teeny-kernels  = "0.1"
teeny-macros   = "0.1"
teeny-triton   = "0.1"
teeny-data     = "0.1"
teeny-cuda     = { version = "0.1", optional = true }
teeny-compiler = { version = "0.1", optional = true }
anyhow         = { version = "1.0", default-features = false }

[dev-dependencies]
serial_test    = "3"
teeny-compiler = "0.1"
dotenv         = "0.15"
insta          = "1"
tokio          = { version = "1", features = ["full"] }
reqwest        = { version = "0.13", features = ["stream"] }
indicatif      = "0.18"
serde          = { version = "1", features = ["derive"] }
clap           = { version = "4", features = ["derive"] }
toml           = "0.8"
zip            = "2"
futures-util   = "0.3"
eframe         = { version = "0.29", features = ["x11"] }
image          = "0.25"
serde_json     = "1"

# [patch.crates-io] overrides all teenygrad crates with local path versions.
# Remove this section once the crates are published to crates.io.
#
# Only include crates that are ACTUALLY in the dependency tree. cross builds
# auto-mount path deps found by `cargo metadata`, but still validate ALL
# [patch] entries even unused ones — unmounted unused patches cause the cross
# build to fail. Keep this list in sync with the transitive dep graph.
[patch.crates-io]
teeny-core     = { path = "../teenygrad/core/teeny-core" }
teeny-kernels  = { path = "../teenygrad/kernels/teeny-kernels" }
teeny-triton   = { path = "../teenygrad/kernels/teeny-triton" }
teeny-compiler = { path = "../teenygrad/compiler/teeny-compiler" }
teeny-macros   = { path = "../teenygrad/macros/teeny-macros" }
teeny-cuda     = { path = "../teenygrad/drivers/teeny-cuda" }
teeny-data     = { path = "../teenygrad/utilities/teeny-data" }
