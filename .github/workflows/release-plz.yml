name: Release-plz

permissions:
  contents: write

on:
  push:
    branches:
      - main

# Cargo.toml's [patch.crates-io] unconditionally resolves teeny-* deps to
# ../teenygrad/... -- must exist as an actual sibling directory.
# actions/checkout refuses a path outside github.workspace, so both repos
# are checked out as sibling subdirectories of the workspace instead (see
# ci.yml for the same pattern, confirmed there via a live failed run), with
# release-plz's manifest_path/config inputs pointed at the vision-rs one.

jobs:
  # Publishes any packages whose version was already bumped by a merged
  # release-plz PR (see the release-plz-pr job below).
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: vision-rs
          fetch-depth: 0
      - name: Checkout teenygrad (sibling dependency)
        uses: actions/checkout@v4
        with:
          repository: teenygrad/teenygrad
          path: teenygrad
          submodules: true
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      # vision-rs's cuda feature (on by default) pulls in teeny-cuda, whose
      # build.rs unconditionally runs bindgen against real CUDA headers --
      # semver_check (release-plz.toml) and cargo publish's own verification
      # both compile it. Same recipe as teenygrad's ci.yml/release-plz.yml:
      # only the -dev packages actually linked against, no driver/dkms.
      - name: Install CUDA toolkit
        run: |
          wget https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb -O /tmp/cuda-keyring.deb
          sudo dpkg -i /tmp/cuda-keyring.deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cuda-nvcc-13-2 cuda-cudart-dev-13-2 cuda-nvrtc-dev-13-2 cuda-driver-dev-13-2 cuda-profiler-api-13-2
          echo "/usr/local/cuda/bin" >> "$GITHUB_PATH"
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
          manifest_path: vision-rs/Cargo.toml
          config: vision-rs/release-plz.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Opens/updates a PR with the next version bump + changelog for review.
  # Merging that PR is what triggers release-plz-release above.
  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # release-plz.toml sets pr_labels = ["release"], which doesn't exist
      # yet on this repo -- creating a missing label goes through the
      # Issues API even for a PR, so pull-requests: write alone isn't
      # enough (confirmed on teenygrad's own release-plz.yml).
      issues: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: vision-rs
          fetch-depth: 0
      - name: Checkout teenygrad (sibling dependency)
        uses: actions/checkout@v4
        with:
          repository: teenygrad/teenygrad
          path: teenygrad
          submodules: true
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      # semver_check (release-plz.toml) compiles the crate too -- see the
      # release-plz-release job above for why CUDA is needed.
      - name: Install CUDA toolkit
        run: |
          wget https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb -O /tmp/cuda-keyring.deb
          sudo dpkg -i /tmp/cuda-keyring.deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cuda-nvcc-13-2 cuda-cudart-dev-13-2 cuda-nvrtc-dev-13-2 cuda-driver-dev-13-2 cuda-profiler-api-13-2
          echo "/usr/local/cuda/bin" >> "$GITHUB_PATH"
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
          manifest_path: vision-rs/Cargo.toml
          config: vision-rs/release-plz.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
