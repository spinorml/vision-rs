[workspace]
changelog_update = true
git_release_enable = true
git_tag_enable = true
pr_labels = ["release"]
repo_url = "https://github.com/teenygrad/vision-rs"
semver_check = true

# demos/parking_garage/ui/dist/index.html is a tracked frontend build output,
# but demos/parking_garage/ui/dist/ also matches the repo-root .gitignore's
# broad `dist/` pattern (meant for `cargo teeny package` output elsewhere) --
# a benign quirk, same shape as teenygrad's release-plz.toml note about its
# vendored onnx submodule. Without this, release-plz's dirty check flags it
# as "uncommitted changes" on every checkout, regardless of working-tree state.
allow_dirty = true
publish_allow_dirty = true
