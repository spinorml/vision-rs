[workspace]
changelog_update = true
git_release_enable = true
git_tag_enable = true
pr_labels = ["release"]
repo_url = "https://github.com/teenygrad/vision-rs"
semver_check = true

# NOTE: actual `cargo publish` is blocked until teenygrad's own crates are
# live on crates.io -- vision-rs depends on teeny-core/teeny-kernels/etc at
# version "0.0.0", resolved locally today only via [patch.crates-io] (which
# `cargo publish` ignores). Until then, the release-plz-release workflow's
# publish step will simply fail to resolve those dependencies from the real
# registry; the version-bump/changelog PR flow is still useful in the
# meantime. No CARGO_REGISTRY_TOKEN secret is configured yet either.
