[workspace]
changelog_update = true
git_release_enable = true
git_tag_enable = true
pr_labels = ["release"]
repo_url = "https://github.com/teenygrad/vision-rs"
semver_check = true

# NOTE: both release-plz workflow jobs are blocked until teenygrad's own
# crates are live on crates.io -- vision-rs depends on teeny-core/
# teeny-kernels/etc at version "0.1.0", resolved locally today only via
# [patch.crates-io] pointing at a sibling ../teenygrad checkout.
#
# - release-plz-release (actual `cargo publish`): Cargo strips [patch]
#   sections for its own publish-verification build, so packaging fails
#   trying to resolve teeny-* from the real registry. Confirmed via a live
#   dry-run: succeeds right up until it needs to actually verify/upload.
# - release-plz-pr (opens the version-bump PR): release-plz's own
#   next-version-determination step copies the project into a temp
#   directory scoped to `git rev-parse --show-toplevel` (i.e. just
#   vision-rs's own repo) before running `cargo update` there -- it has no
#   way to know [patch.crates-io] needs a sibling directory *outside* that
#   git repo to exist too, so the copy never includes ../teenygrad and
#   `cargo update` fails to resolve teeny-cli (or whichever crate). Root
#   caused via a local repro with RELEASE_PLZ_LOG=trace; not fixable via
#   config, and unrelated to CUDA/ONNX (both independently verified fine).
#
# Both failure modes go away naturally once teenygrad's crates are
# actually published and [patch.crates-io] is removed from Cargo.toml --
# there's no relative path left to break at that point.
